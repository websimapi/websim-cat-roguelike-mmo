<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Roguelike MMO</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            image-rendering: pixelated;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2000;
        }
        #chat-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #fff;
            border-radius: 8px;
            padding: 15px;
            color: white;
            display: none;
            pointer-events: auto;
        }
        #npc-name {
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 5px;
        }
        #npc-text {
            font-size: 16px;
            line-height: 1.4;
        }
        .interaction-prompt {
            position: absolute;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 14px;
            pointer-events: none;
            display: none;
            z-index: 100;
        }
        #loading {
            position: absolute;
            color: white;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="bgCanvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;"></canvas>
        <div id="loading">Loading Assets & Connecting...</div>
        <canvas id="gameCanvas" style="position: relative; z-index: 1;"></canvas>
        <div id="ui-layer">
            <div id="interaction-label" class="interaction-prompt">Press 'T' to Talk</div>
            <div id="chat-box">
                <div id="npc-name">Shopkeeper</div>
                <div id="npc-text">...</div>
            </div>
        </div>
    </div>
    <script type="module" src="src/main.js"></script>

</body>
</html>
